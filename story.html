<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Story — he writes</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" /><link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="studio.css" /></head>
  <body><header class="site-header"><a class="brand" href="index.html">he writes<span>.</span><small>by Anupam Bhardwaj</small></a><a class="text-link" href="index.html#journal">All writing <span>→</span></a></header><main class="story-page"><p class="eyebrow" id="story-meta"></p><h1 id="story-title"></h1><p class="story-excerpt" id="story-excerpt"></p><article id="story-body"></article></main><script>
const post = JSON.parse(localStorage.getItem('heWritesPosts') || '[]').find(p => String(p.id) === new URLSearchParams(location.search).get('id'));
if (!post) { document.querySelector('.story-page').innerHTML = '<h1>This piece is not available on this browser.</h1><a class="text-link" href="index.html">Return home <span>→</span></a>'; } else { document.title = `${post.title} — he writes`; document.querySelector('#story-meta').textContent = `${post.category} · ${post.date}`; document.querySelector('#story-title').textContent = post.title; document.querySelector('#story-excerpt').textContent = post.excerpt; document.querySelector('#story-body').textContent = post.body; }
</script></body>
</html>
